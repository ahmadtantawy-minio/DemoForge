id: clickhouse
name: ClickHouse
category: analytics
icon: clickhouse
version: "latest"
image: clickhouse/clickhouse-server:latest
image_size_mb: 350
description: "Column-oriented OLAP database for real-time analytics on MinIO/AIStor via S3 table functions and S3Queue"

resources:
  memory: "1g"
  cpu: 0.5

ports:
  - name: http
    container: 8123
    protocol: tcp
  - name: native
    container: 9001
    protocol: tcp

environment:
  CLICKHOUSE_DB: "default"
  CLICKHOUSE_USER: "default"
  CLICKHOUSE_PASSWORD: ""
  # Injected from MinIO s3 / s3-queue edges at compose time
  S3_ENDPOINT: ""
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin
  S3_BUCKET: demo-bucket
  CLICKHOUSE_INIT_SQL: /docker-entrypoint-initdb.d/init-s3.sql

health_check:
  endpoint: /ping
  port: 8123
  interval: 10s
  timeout: 5s

secrets: []

web_ui:
  - name: play
    port: 8123
    path: "/play"
    description: "ClickHouse Play UI — interactive SQL console"

terminal:
  shell: /bin/bash
  welcome_message: "ClickHouse server. Use 'clickhouse-client' for SQL. S3 endpoint is in $S3_ENDPOINT."
  quick_actions:
    - label: "Show databases"
      command: "clickhouse-client --port 9001 --query 'SHOW DATABASES'"
    - label: "Show tables"
      command: "clickhouse-client --port 9001 --query 'SHOW TABLES'"
    - label: "Query S3 view"
      command: "clickhouse-client --port 9001 --query 'SELECT count() FROM demoforge_s3_files'"
    - label: "Query S3 (env)"
      command: "clickhouse-client --port 9001 --query \"SELECT count() FROM s3('${S3_ENDPOINT}/${S3_BUCKET}/*.csv', '${S3_ACCESS_KEY}', '${S3_SECRET_KEY}', 'CSVWithNames')\""
    - label: "Server info"
      command: "clickhouse-client --port 9001 --query 'SELECT version(), uptime()'"

connections:
  provides:
    - type: sql-query
      port: 8123
      description: "ClickHouse HTTP SQL endpoint"
      config_schema: []
    - type: metrics
      port: 8123
      path: "/metrics"
      description: "Prometheus metrics endpoint"
      config_schema: []
  accepts:
    - type: s3
      config_schema:
        - key: source_bucket
          label: "Source Bucket"
          type: string
          default: "demo-bucket"
        - key: file_pattern
          label: "File Pattern"
          type: string
          default: "*.csv"
        - key: format
          label: "Data Format"
          type: select
          options: ["CSVWithNames", "JSONEachRow", "Parquet", "ORC"]
          default: "CSVWithNames"
    - type: s3-queue
      config_schema:
        - key: source_bucket
          label: "Source Bucket"
          type: string
          default: "demo-bucket"
        - key: file_pattern
          label: "File Pattern"
          type: string
          default: "*.csv"
        - key: format
          label: "Data Format"
          type: select
          options: ["CSVWithNames", "JSONEachRow", "Parquet"]
          default: "CSVWithNames"
        - key: table_name
          label: "Target Table Name"
          type: string
          default: "s3queue_ingest"

variants:
  default:
    description: "Single ClickHouse server with S3 (MinIO/AIStor) integration"

template_mounts:
  - template: init-s3.sql.j2
    mount_path: /docker-entrypoint-initdb.d/init-s3.sql

static_mounts:
  - host_path: "config/override.xml"
    mount_path: "/etc/clickhouse-server/config.d/override.xml"
  - host_path: "scripts/apply-s3-init.sh"
    mount_path: "/opt/demoforge/apply-s3-init.sh"

init_scripts:
  - command: "bash /opt/demoforge/apply-s3-init.sh"
    wait_for_healthy: true
    timeout: 90
    order: 1
    description: "Create MinIO named collection and demoforge_s3_files view"
